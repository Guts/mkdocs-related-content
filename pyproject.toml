[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=64", "setuptools-scm>=8"]

[project]
name = "mkdocs-related-content-plugin"
description = "Properdocs/MkDocs plugin that computes, for every tagged page, a list of related pages based on shared tags, and exposes it to the Jinja context."
dynamic = ["version"]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Julien Moura", email = "dev@ingeoveritas.com" }]
maintainers = [{ name = "Julien Moura", email = "dev@ingeoveritas.com" }]
keywords = [
    "documentation",
    "Jaccard",
    "mkdocs",
    "plugin",
    "properdocs",
    "related",
    "see also",
    "similarity",
    "tags",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Documentation",
    "Topic :: Software Development :: Documentation",
    "Topic :: Text Processing :: Markup :: Markdown",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.16.1",
    "pre-commit>=4.6.1,<5",
]
docs = [
    "mkdocs-git-committers-plugin-2>=2.4.1,<2.6",
    "mkdocs-materialx[imaging]>=10.2.0,<11",
    "mkdocstrings-python>=1.16.2,<2.1",
    "mkdocs-rss-plugin",
    "termynal>=0.12.2,<0.15",

]
test = [
    "mkdocs-materialx[imaging]>=10.2.0,<11",
    "pytest-cov>=6.9.1,<8",
]

[project.entry-points."mkdocs.plugins"]
related-content = "mkdocs_related_content.plugin:RelatedContentPlugin"

[project.urls]
Changelog = "https://github.com/guts/mkdocs-related-content/blob/main/CHANGELOG.md"
Documentation = "https://guts.github.io/mkdocs-related-content/"
Homepage = "https://guts.github.io/mkdocs-related-content/"
Issues = "https://github.com/guts/mkdocs-related-content/issues/"
releasenotes = "https://github.com/guts/mkdocs-related-content/releases/latest"
Repository = "https://github.com/guts/mkdocs-related-content/"


# -- TOOLING CONFIGURATION --

# Black configuration
[tool.black]
target-version = ["py310", "py311", "py312", "py313", "py314"]

# Coverage configuration
[tool.coverage.report]
exclude_also = [
    # Don't complain about abstract methods, they aren't run:
    "@(abc\\.)?abstractmethod",
    "class .*\\bProtocol\\):",
    # Don't complain about missing debug-only code:
    "def __repr__",
    "if self.debug:",
     # Don't complain if non-runnable code isn't run:
    "if 0:",
    "if __name__ == .__main__.:",
    # Don't complain about imports for type checking:
    "if TYPE_CHECKING:",
    # Don't complain if tests don't hit defensive assertion code:
    "raise AssertionError",
    "raise NotImplementedError",
    # ignore lines marked with a pragma
    "pragma: no cover",
]
ignore_errors = true
show_missing = true

[tool.coverage.run]
branch = true
omit = ["*/tests/*", "*/__pycache__/*", "*/.venv/*", "*/_version.py"]

[tool.flake8]
count = true
exclude = [
    ".git",
    "__pycache__",
    "docs/conf.py",
    "old",
    "build",
    "dist",
    ".venv*",
    "tests",
]
ignore = ["E121", "E123", "E126", "E203", "E226", "E24", "E704", "W503", "W504"]
max-complexity = 15
max-doc-length = 130
max-line-length = 100
statistics = true
tee = true

[tool.isort]
profile = "black"
ensure_newline_before_comments = true
force_grid_wrap = 0
include_trailing_comma = true
line_length = 88
multi_line_output = 3
use_parentheses = true

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [".git", "__pycache__", "old", "build", "dist", "tests/dev", ".venv*"]

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = "dynamic"
indent-style = "space"
line-ending = "auto"
quote-style = "double"
skip-magic-trailing-comma = false

[tool.ruff.lint]
select = [
    "A",   # flake8-builtins
    "ANN", # flake8-annotations
    "B",   # flake8-bugbear
    "C90", # mccabe complexity
    "E",   # pycodestyle errors
    "ERA", # eradicate (commented code)
    "F",   # pyflakes
    "I",   # isort
    "LOG", # flake8-logging
    "N",   # pep8-naming
    "PTH", # flake8-pathlib
    "S",   # bandit security
    "TC",  # flake8-type-checking
    "T20", # flake8-print
    "W",   # pycodestyle warnings
]

ignore = [
    "ANN201", # Missing return type annotation for public function
    "ANN204", #  Missing return type annotation for special method `__init__`
    "ANN401", # Dynamically typed expressions (typing.Any) are disallowed in `**kwargs`
    "E501",   # line too long (handled by black)
    # "E203", # whitespace before ':'
    # "E226", # missing whitespace around arithmetic operator
    # "E24",  # multiple spaces after ','
]

[tool.ruff.lint.per-file-ignores]
# Ignore `E402` (import violations) in all `__init__.py` files
"__init__.py" = ["E402"]
# Ignore rules in tests
"tests/test_*.py" = ["ANN001", "ANN2", "S101", "T20"]

[tool.ruff.lint.pydocstyle]
convention = "google"

# Pytest configuration
[tool.pytest.ini_options]
addopts = [
    "--junitxml=junit/test-results.xml",
    "--cov=mkdocs_related_content",
    "--cov-config=pyproject.toml",
    "--cov-report=html",
    "--cov-report=term",
    "--cov-report=xml",
    "--ignore=tests/_wip/",
]
junit_family = "xunit2"
minversion = "7.0"
norecursedirs = ".* build dev development dist docs CVS fixtures _darcs {arch} *.egg venv _wip"
python_files = ["test_*.py"]
testpaths = ["tests"]

# Setuptools configuration
[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["mkdocs_related_content"]
namespaces = false
where = ["src"]

# setuptools-scm configuration
[tool.setuptools_scm]
fallback_version = "0.0.0+unknown"
local_scheme = "no-local-version"
version_scheme = "guess-next-dev"
write_to = "src/mkdocs_related_content/_version.py"
