# Project information
site_name: MkDocs RSS Plugin - TEST
site_description: Basic setup to test against MkDocs RSS plugin
site_author: Julien Moura (Guts)
site_url: https://guts.github.io/mkdocs-related-content
copyright: "Guts - In Geo Veritas"

# Repository
repo_name: "guts/mkdocs-related-content"
repo_url: "https://github.com/guts/mkdocs-related-content"

use_directory_urls: true

plugins:
  - rss:
      date_from_meta:
        # date location given as dot key
        as_creation: "date.created"
        as_update: "update"
        datetime_format: "%Y-%m-%d %H:%M"

theme:
  name: readthedocs

# Extensions to enhance markdown
markdown_extensions:
  - meta
